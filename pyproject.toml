# ============================================================================
# Project Metadata
# ============================================================================
[project.urls]
Homepage = "https://github.com/zhangsq-nju/EdgeRazor"

[project]
name = "edgerazor"
version = "1.3.0"
description = "EdgeRazor: Lightweight framework for Edge AI."
readme = "./asset/README_pypi.md"
requires-python = ">=3.10.20"
license = { text = "Apache 2.0" }
authors = [
    { name = "Shu-Hao Zhang" },
    { email = "zhangsh@lamda.nju.edu.cn" }
]

keywords = [
    "Lightweight AI", "Edge AI", "Model Compression",
    "Quantization-Aware Distillation", "Quantization", "Distillation",
    "LLM", "Lightweight LLM", "LLM Compression", "LLM Quantization", "LLM Distillation",
]
classifiers = [
    "Development Status :: 4 - Beta",  # "Development Status :: 5 - Production/Stable" is coming soon.
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux", 
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies
dependencies = [
    "ruff>=0.13.1",
    "transformers>=4.55.0,<=4.57.1",
    "pyyaml==6.0.3",
    "torch<=2.9.1,>=2.8.0",
    "torchvision>=0.20.0",
    "pyfiglet>=1.0.0",
    "colorama>=0.4.0",
]

# ============================================================================
# Ruff Linter & Formatter Configuration
# ============================================================================
[tool.ruff]
line-length = 88
target-version = "py310"
indent-width = 4

[tool.ruff.lint]
select = [
    # Code Quality & Style
    "E",   # pycodestyle errors - PEP 8 style violations (e.g., E501: line too long)
    "W",   # pycodestyle warnings - PEP 8 style warnings (e.g., W291: trailing whitespace)
    "F",   # pyflakes - Detect unused imports, variables, and undefined names

    # Import Management
    "I",   # isort - Automatically sort and organize import statements

    # Naming Conventions
    "N",   # pep8-naming - Enforce PEP 8 naming conventions (e.g., class names in PascalCase)

    # Modern Python Practices
    "UP",  # pyupgrade - Suggest modern Python syntax (e.g., use `list[str]` instead of `List[str]`)

    # Bug Detection
    "B",   # flake8-bugbear - Find likely bugs and design problems (e.g., mutable default arguments)

    # Code Simplification
    "C4",  # flake8-comprehensions - Suggest better list/dict/set comprehensions
]
ignore = [
    "N806",  # Allow uppercase variables in functions (common in math/ML code: W, B, etc.)
    "E501",  # Allow lines longer than 88 chars (some docstrings and URLs exceed this)
    "W293",  # Allow blank lines containing whitespace
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# Optional Development Dependencies
# ============================================================================
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "nox>=2024.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
]

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
]

[tool.coverage.run]
source = ["src/edgerazor"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ============================================================================
# Build System
# ============================================================================
[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["edgerazor*"]